<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SmartRx System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 py-12">

<div class="max-w-lg w-full">
    <div class="flex justify-between items-center mb-8">
        <a href="index.html" class="text-2xl font-bold text-blue-700">SmartRx</a>
        <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center transition">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Home
        </a>
    </div>

    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-gray-100">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
            <p class="text-gray-500 mt-2">Join the digital prescription platform</p>
        </div>

        <form id="signupForm" class="space-y-5">
            <div>
                <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-gray-50 hover:bg-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Mobile Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+880"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50 hover:bg-white">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50 hover:bg-white">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Create Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="Minimum 8 characters"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50 hover:bg-white pr-12">
                    <button type="button" onclick="togglePassword('password', 'eyeIconSignup')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 focus:outline-none">
                        <svg id="eyeIconSignup" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-start py-2">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                </div>
                <div class="ml-3 text-xs leading-5 text-gray-500">
                    By signing up, I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a>.
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all active:scale-[0.98] mt-4">
                Register Now
            </button>
        </form>

        <div class="mt-10 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-600">
                Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline ml-1">Log in here</a>
            </p>
        </div>
    </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
