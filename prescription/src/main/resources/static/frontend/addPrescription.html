<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Prescription | SmartRx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

<nav class="bg-white border-b px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-4">
        <a href="dashboard.html" class="text-gray-400 hover:text-blue-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">Add New Prescription</h1>
    </div>
</nav>

<main class="max-w-3xl mx-auto mt-8 px-4">

    <div class="flex bg-gray-200 p-1 rounded-2xl mb-8">
        <button onclick="switchTab('manual')" id="tab-manual" class="flex-1 py-3 text-center rounded-xl font-bold transition bg-white text-blue-600 shadow-sm">Manual Entry</button>
        <button onclick="switchTab('pdf')" id="tab-pdf" class="flex-1 py-3 text-center rounded-xl font-bold transition text-gray-500 hover:text-gray-700">Upload PDF</button>
    </div>

    <div id="manual-form" class="space-y-6">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-6">Doctor & Clinic Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Doctor's Name</label>
                    <input type="text" id="doctorName" placeholder="e.g. Dr. Ahmed Ali" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Date of Visit</label>
                    <input type="date" id="prescriptionDate" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                </div>


            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-800">Medicines</h3>
                <button type="button" onclick="addMedicineRow()" class="text-blue-600 text-sm font-bold hover:underline">+ Add Another</button>
            </div>

            <div id="medicine-list" class="space-y-4">
            </div>
        </div>

        <button onclick="submitPrescription()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg transition-all active:scale-[0.98]">
            Save & Generate PDF
        </button>
    </div>

    <div id="pdf-form" class="hidden">
        <div class="bg-white p-12 rounded-3xl shadow-sm border border-gray-100 border-dashed border-2 flex flex-col items-center justify-center text-center">
            <span class="text-4xl mb-4">📄</span>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Upload Prescription PDF</h3>
            <input type="file" id="fileInput" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">Select File</button>
        </div>
    </div>
</main>

<script src="js/add_prescription.js"></script>
<script>
    function switchTab(type) {
        document.getElementById('manual-form').classList.toggle('hidden', type !== 'manual');
        document.getElementById('pdf-form').classList.toggle('hidden', type !== 'pdf');
    }
</script>
</body>
</html>
