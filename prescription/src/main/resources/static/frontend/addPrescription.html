<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Prescription | SmartRx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <nav class="bg-white border-b px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <a href="dashboard.html" class="text-gray-400 hover:text-blue-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <h1 class="text-xl font-bold text-gray-800">Add New Prescription</h1>
        </div>
        <div class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Manual or PDF</div>
    </nav>

    <main class="max-w-3xl mx-auto mt-8 px-4">
        
        <div class="flex bg-gray-200 p-1 rounded-2xl mb-8">
            <button onclick="switchTab('manual')" id="tab-manual" class="flex-1 py-3 text-center rounded-xl font-bold transition bg-white text-blue-600 shadow-sm">
                Manual Entry
            </button>
            <button onclick="switchTab('pdf')" id="tab-pdf" class="flex-1 py-3 text-center rounded-xl font-bold transition text-gray-500 hover:text-gray-700">
                Upload PDF
            </button>
        </div>

        <div id="manual-form" class="space-y-6">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-6">Doctor & Clinic Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Doctor's Name</label>
                        <input type="text" placeholder="e.g. Dr. Ahmed Ali" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Date of Visit</label>
                        <input type="date" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-gray-800">Medicines</h3>
                    <button type="button" class="text-blue-600 text-sm font-bold">+ Add Another</button>
                </div>
                
                <div class="space-y-4 p-4 border border-blue-50 rounded-2xl bg-blue-50/30">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Medicine Name</label>
                            <input type="text" placeholder="Search medicine..." class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Dosage (per day)</label>
                            <select class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none bg-white">
                                <option>1-0-1 (Twice)</option>
                                <option>1-1-1 (Thrice)</option>
                                <option>0-0-1 (Nightly)</option>
                                <option>1-0-0 (Morning)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <button class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all active:scale-[0.98]">
                Save Prescription
            </button>
        </div>

        <div id="pdf-form" class="hidden">
            <div class="bg-white p-12 rounded-3xl shadow-sm border border-gray-100 border-dashed border-2 flex flex-col items-center justify-center text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-6">
                    <span class="text-4xl text-blue-600">📄</span>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">Upload Prescription PDF</h3>
                <p class="text-gray-500 mb-8 max-w-xs">Upload a clear digital copy of your prescription for secure storage.</p>
                <input type="file" id="fileInput" class="hidden">
                <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-100">
                    Select File
                </button>
                <p class="mt-4 text-xs text-gray-400">Supported formats: PDF, JPG, PNG (Max 5MB)</p>
            </div>
        </div>

    </main>

    <script>
        function switchTab(type) {
            const manual = document.getElementById('manual-form');
            const pdf = document.getElementById('pdf-form');
            const btnManual = document.getElementById('tab-manual');
            const btnPdf = document.getElementById('tab-pdf');

            if (type === 'manual') {
                manual.classList.remove('hidden');
                pdf.classList.add('hidden');
                btnManual.className = "flex-1 py-3 text-center rounded-xl font-bold transition bg-white text-blue-600 shadow-sm";
                btnPdf.className = "flex-1 py-3 text-center rounded-xl font-bold transition text-gray-500 hover:text-gray-700";
            } else {
                manual.classList.add('hidden');
                pdf.classList.remove('hidden');
                btnPdf.className = "flex-1 py-3 text-center rounded-xl font-bold transition bg-white text-blue-600 shadow-sm";
                btnManual.className = "flex-1 py-3 text-center rounded-xl font-bold transition text-gray-500 hover:text-gray-700";
            }
        }
    </script>

</body>
</html>
