<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Medicine | SmartRx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

<nav class="bg-white border-b sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-4">
        <a href="dashboard.html" class="text-gray-400 hover:text-blue-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-xl font-bold text-blue-700">SmartRx <span class="text-gray-400 font-medium">| Engine</span></h1>
    </div>
    <div class="flex items-center space-x-3">
        <button class="text-xs font-bold border px-3 py-1 rounded-full hover:bg-gray-50">EN | বাং</button>
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white text-xs font-bold">U</div>
    </div>
</nav>

<header class="bg-white border-b py-12 px-4">
    <div class="max-w-3xl mx-auto text-center">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-4">Find Medicine Information</h2>
        <p class="text-gray-500 mb-8">Search by Brand Name or Generic Formula to see side effects and alternatives.</p>

        <div class="relative group">
            <input type="text" id="medicineSearch" placeholder="Search (e.g. Napa, Seclo, Azithromycin...)"
                   class="w-full pl-14 pr-4 py-5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl shadow-sm outline-none transition-all text-lg">
            <div class="absolute left-5 top-5 text-gray-400 group-focus-within:text-blue-500 transition-colors">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto p-6 md:p-8">
    <div id="results-area" class="grid grid-cols-1 gap-4"></div>

    <div id="empty-state" class="hidden py-20 text-center">
        <div class="text-6xl mb-4">🔍</div>
        <h3 class="text-xl font-bold text-gray-800">No Medicine Found</h3>
        <p class="text-gray-500">Try searching with a different name.</p>
    </div>
</main>

<footer class="max-w-4xl mx-auto mt-12 mb-8 pt-8 border-t border-gray-200 px-6 text-center md:text-left">
    <p class="text-gray-400 text-xs">&copy; 2026 SmartRx Medicine Engine. Data verified by BD NF.</p>
</footer>

<script src="js/medicine_search.js"></script>
</body>
</html>
