<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SmartRx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-white border-b px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <a href="dashboard.html" class="text-gray-400 hover:text-blue-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <h1 class="text-xl font-bold text-gray-800">Account Settings</h1>
        </div>
        <button class="text-red-500 font-semibold text-sm hover:bg-red-50 px-4 py-2 rounded-xl transition">Logout</button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 md:p-10">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 text-center">
                    <div class="relative inline-block">
                        <div class="w-24 h-24 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-white text-3xl font-bold border-4 border-blue-50">
                            JD
                        </div>
                        <button class="absolute bottom-0 right-0 bg-white border shadow-sm p-1.5 rounded-full text-blue-600 hover:text-blue-700">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                    <h2 class="text-xl font-bold text-gray-900 mt-4">John Doe</h2>
                    <p class="text-sm text-gray-500">Member since Oct 2024</p>
                    
                    <div class="mt-6 pt-6 border-t border-gray-50 grid grid-cols-2 gap-4">
                        <div class="text-center">
                            <p class="text-xs text-gray-400 font-bold uppercase">Prescriptions</p>
                            <p class="text-xl font-bold text-blue-600">12</p>
                        </div>
                        <div class="text-center">
                            <p class="text-xs text-gray-400 font-bold uppercase">Active Meds</p>
                            <p class="text-xl font-bold text-green-600">4</p>
                        </div>
                    </div>
                </div>

                <div class="bg-red-50 p-6 rounded-3xl border border-red-100">
                    <h3 class="text-red-800 font-bold text-sm mb-3 uppercase tracking-wider">Emergency Info</h3>
                    <div class="space-y-3">
                        <div>
                            <p class="text-[10px] text-red-400 font-bold uppercase">Blood Group</p>
                            <p class="font-bold text-red-700">O Positive (O+)</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-red-400 font-bold uppercase">Allergies</p>
                            <p class="font-bold text-red-700">Penicillin, Dust</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-100">
                    <h3 class="text-xl font-bold text-gray-800 mb-8 pb-4 border-b">Personal Information</h3>
                    
                    <form action="/update-profile" method="POST" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                                <input type="text" value="John Doe" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                                <input type="text" value="+880 1712 345678" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                                <input type="email" value="john.doe@example.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition bg-gray-50">
                            </div>
                        </div>

                        <div class="pt-6 border-t border-gray-50 flex flex-col sm:flex-row gap-4">
                            <button type="submit" class="flex-1 bg-blue-600 text-white py-3.5 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition active:scale-95">
                                Save Changes
                            </button>
                            <button type="button" class="flex-1 bg-gray-100 text-gray-600 py-3.5 rounded-xl font-bold hover:bg-gray-200 transition">
                                Change Password
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <h3 class="text-xl font-bold text-gray-800 mb-6">System Preferences</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-4 bg-gray-50 rounded-2xl">
                            <div>
                                <p class="font-bold text-gray-700 text-sm">Default Language</p>
                                <p class="text-xs text-gray-500">The app will use this for medicine info.</p>
                            </div>
                            <select class="bg-white border rounded-lg px-3 py-1.5 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
                                <option>English</option>
                                <option>Bangla (বাংলা)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
